name: Anime updates

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [episode-update]
  workflow_dispatch:
    inputs:
      mode:
        description: "hello = test message, once = abhi check karo"
        type: choice
        options: [once, hello]
        default: once

permissions:
  contents: write

concurrency:
  group: anime-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          ANIME_LANGUAGE: "English, Hindi, Tamil, Telugu, Japanese (Sub)"
        run: python anime_bot.py ${{ github.event.inputs.mode || 'once' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "anime-bot"
          git config user.email "anime-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -f data/state.json || true
          git diff --cached --quiet || (git commit -m "state update" && git push)
